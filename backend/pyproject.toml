[project]
name = "verzel-events-backend"
version = "0.1.0"
description = "Backend for the Verzel event ticketing challenge"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "email-validator>=2.2.0",
    "fastapi[standard]>=0.112.0",
    "httpx>=0.27.0",
    "bcrypt>=4.0.1,<5.0.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.2.1",
    "pydantic-settings>=2.4.0",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy>=2.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "ruff>=0.5.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
